plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'cn.alvkeke.dropto'
    compileSdk 36

    defaultConfig {
        applicationId 'cn.alvkeke.dropto'
        minSdk 33
        targetSdk 34
        versionCode 4000
        versionName '0.4.0'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file(project.hasProperty('keystoreFile') ? project.property('keystoreFile') : "release.keystore")
            storePassword project.hasProperty('keystorePassword') ? project.property('keystorePassword') : ""
            keyAlias project.hasProperty('keyAlias') ? project.property('keyAlias') : ""
            keyPassword project.hasProperty('keyPassword') ? project.property('keyPassword') : ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            resValue "string", "app_name", "DropTo (Dev)"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    implementation 'androidx.core:core-ktx:1.17.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// kotlin-lsp wires only main-variant generators into its import task, so nested
// components (androidTest/unitTest) get their task-backed sources queried before
// the producing tasks run, which aborts the whole import: Kotlin/kotlin-lsp#233.
// Drop this block once that fix is released.
// =====================================================================================================
def projectTasks = tasks
projectTasks.matching { it.name == "prepareKotlinIdeaImport" }.configureEach { prepare ->
    prepare.dependsOn(projectTasks.matching { candidate ->
        def name = candidate.name
        (name.contains("AndroidTest") || name.contains("UnitTest")) && !name.contains("Lint") &&
            (name.startsWith("generate") || name.startsWith("javaPreCompile") ||
                name.startsWith("map") || name.startsWith("merge"))
    })
}
// =====================================================================================================
